apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-reader
  namespace: selim
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: selim
  name: role-reader
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rb-reader
  namespace: selim
subjects:
- kind: ServiceAccount
  name: sa-reader
  namespace: selim
roleRef:
  kind: Role
  name: role-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-developer
  namespace: selim
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: selim
  name: role-developer
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rb-developer
  namespace: selim
subjects:
- kind: ServiceAccount
  name: sa-developer
  namespace: selim
roleRef:
  kind: Role
  name: role-developer
  apiGroup: rbac.authorization.k8s.io
