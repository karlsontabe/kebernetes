apiVersion: v1
kind: Secret
metadata:
  name: secret-sensible-prod
  namespace: selim
type: Opaque
stringData:
  API_KEY: "SK-SUPER-SECRET-998877"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: leaky-sa
  namespace: selim
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: role-lecture-secrets
  namespace: selim
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: leaky-binding
  namespace: selim
subjects:
- kind: ServiceAccount
  name: leaky-sa
  namespace: selim
roleRef:
  kind: Role
  name: role-lecture-secrets
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Pod
metadata:
  name: attacker-pod
  namespace: selim
spec:
  serviceAccountName: leaky-sa
  containers:
  - name: attacker
    image: curlimages/curl:latest
    command: ["sleep", "3600"]
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
