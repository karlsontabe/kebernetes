apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: romy
  labels:
    app: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: db-svc
  namespace: romy
  labels:
    app: db
spec:
  selector:
    app: db
  ports:
  - port: 80
    targetPort: 80
